name: Publish numerical runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: dependency.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/emregorucu/turbulence-numerical-runtime:python-3.12.7
          labels: |
            org.opencontainers.image.source=https://github.com/emregorucu/turbulence-numerical-runtime
      - name: Verify published versions
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/emregorucu/turbulence-numerical-runtime@$IMAGE_DIGEST"
          docker pull "$image"
          docker run --rm --cpus=4 --memory=8g --network=none "$image" /usr/local/bin/python3 -c 'import sys,numpy,scipy,pandas,matplotlib; actual=(sys.version.split()[0],numpy.__version__,scipy.__version__,pandas.__version__,matplotlib.__version__); print(actual); assert actual == ("3.12.7","2.1.3","1.14.1","2.2.3","3.9.2")'
          printf '%s\n' "$image" > image-reference.txt
          printf 'Published `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          docker image rm "$image"
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-runtime-reference
          path: image-reference.txt
